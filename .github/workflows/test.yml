name: tiktok-reachability
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check TikTok
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          for U in johora tiktok; do
            echo "##### USER $U"
            code=$(curl -s -L -o page.html -w "%{http_code}" -A "$UA" "https://www.tiktok.com/@$U")
            echo "profile page: HTTP $code, $(wc -c < page.html) bytes"
            echo "page title: $(grep -o '<title>[^<]*' page.html | head -1)"
            echo "has uniqueId: $(grep -c "\"uniqueId\":\"$U\"" page.html || true)"
            code=$(curl -s -o api.json -w "%{http_code}" -A "$UA" "https://www.tiktok.com/api-live/user/room/?aid=1988&uniqueId=$U&sourceType=54")
            echo "room API: HTTP $code, $(wc -c < api.json) bytes"
            echo "room API body: $(head -c 500 api.json)"
          done
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
