name: Manage Drive recordings
on:
  workflow_dispatch:
    inputs:
      action:
        description: Google Drive operation
        required: true
        type: choice
        options:
          - delete
          - backfill-durations
      drive_id:
        description: Verified LIVEVAULT Drive file ID (delete only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  drive-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      DASHBOARD_API_URL: ${{ vars.DASHBOARD_API_URL }}
      DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for videos without Drive duration metadata
        if: inputs.action == 'backfill-durations'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Verify dashboard token propagation
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          token = os.environ["DASHBOARD_API_TOKEN"]
          print(f"Dashboard token fingerprint: {hashlib.sha256(token.encode()).hexdigest()[:12]}")
          PY
      - name: Run Drive operation
        env:
          ACTION: ${{ inputs.action }}
          DRIVE_ID: ${{ inputs.drive_id }}
        run: python3 engine/drive_admin.py "$ACTION" "$DRIVE_ID"
