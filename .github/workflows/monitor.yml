name: Live monitor
on:
  workflow_dispatch:
    inputs:
      target_username:
        description: Optional TikTok username to check instead of all tracked accounts
        required: false
        type: string
permissions:
  actions: write
  contents: read
concurrency:
  group: livevault-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRACKED: ${{ vars.TRACKED }}
      TARGET_USERNAME: ${{ inputs.target_username }}
      SEGMENT_MINUTES: ${{ vars.SEGMENT_MINUTES || '30' }}
      QUIET_HOURS_ENABLED: ${{ vars.QUIET_HOURS_ENABLED || 'false' }}
      QUIET_START: ${{ vars.QUIET_START }}
      QUIET_END: ${{ vars.QUIET_END }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOST_KEY_SECRET: ${{ secrets.HOST_KEY_SECRET }}
      DASHBOARD_API_URL: ${{ vars.DASHBOARD_API_URL }}
      DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked accounts and dispatch recorders
        run: python3 engine/monitor.py
