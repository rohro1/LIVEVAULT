name: recorder-test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Get recorder 7.7.1
        run: |
          git clone -q https://github.com/Michele0303/tiktok-live-recorder.git tlr
          cd tlr && git checkout -q 7.7.1
          echo "RESULT: commit $(git log -1 --format=%h)"
          echo "RESULT: license: $(head -1 LICENSE)"
          echo "RESULT: files: $(ls | tr '\n' ' ')"
      - name: Record 60 seconds
        env:
          HOST: queen_bee_diaries
        run: |
          pip install -q uv
          cd tlr
          if [ -f pyproject.toml ]; then uv sync -q; RUN="uv run python"; else pip install -q -r requirements.txt; RUN="python"; fi
          mkdir -p ../out
          set +e
          timeout 150 $RUN src/main.py -user "$HOST" -mode manual -duration 60 -output ../out 2>&1 | tee ../rec.log
          tail -n 20 ../rec.log | sed 's/^/RESULT: log: /'
      - name: Inspect output
        run: |
          find out -type f | sed 's/^/RESULT: file: /'
          find out -type f | while read f; do
            ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name -of default=nw=1 "$f" | sed "s|^|RESULT: probe: |"
          done
